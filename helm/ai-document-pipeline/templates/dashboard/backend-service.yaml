{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-document-pipeline.fullname" . }}-dashboard-backend
  namespace: {{ include "ai-document-pipeline.namespace" . }}
  labels:
    {{- include "ai-document-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard-backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3001
    targetPort: 3001
  selector:
    {{- include "ai-document-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard-backend
{{- end }}
