{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ include "ai-document-pipeline.namespace" . }}
  labels:
    {{- include "ai-document-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  ports:
  - name: api
    port: {{ .Values.minio.service.port }}
    targetPort: api
    protocol: TCP
  - name: console
    port: {{ .Values.minio.service.consolePort }}
    targetPort: console
    protocol: TCP
  selector:
    {{- include "ai-document-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: minio
{{- end }}
