{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ include "ai-document-pipeline.namespace" . }}
  labels:
    {{- include "ai-document-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: ClusterIP
  ports:
  - name: api
    port: {{ .Values.ollama.service.port }}
    targetPort: api
    protocol: TCP
  selector:
    {{- include "ai-document-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
{{- end }}
