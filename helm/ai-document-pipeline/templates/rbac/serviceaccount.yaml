{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-document-pipeline.serviceAccountName" . }}
  namespace: {{ include "ai-document-pipeline.namespace" . }}
  labels:
    {{- include "ai-document-pipeline.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo
  namespace: {{ include "ai-document-pipeline.namespace" . }}
  labels:
    {{- include "ai-document-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: argo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-server
  namespace: {{ include "ai-document-pipeline.namespace" . }}
  labels:
    {{- include "ai-document-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: argo-server
{{- end }}
