apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-dashboard-backend
  namespace: argo-ai-demo
  labels:
    app: ai-dashboard
  annotations:
    # Enable WebSocket support with longer timeout
    haproxy.router.openshift.io/timeout: 3600s
    # Allow WebSocket upgrade
    haproxy.router.openshift.io/rewrite-target: /
spec:
  to:
    kind: Service
    name: ai-dashboard-backend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
