# Development overlay for Kustomize
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-ai-dev

bases:
  - ../../base

# Dev-specific image tags
images:
  - name: quay.io/aasmith/ai-workflow-dashboard-backend
    newTag: latest
  - name: quay.io/aasmith/ai-workflow-dashboard-frontend
    newTag: latest

# Dev-specific patches
patchesStrategicMerge:
  - deployment-patch.yaml

# Dev ConfigMap
configMapGenerator:
  - name: dashboard-config
    literals:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - API_TIMEOUT=30s
