# Development-specific deployment patches
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-dashboard-backend
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: backend
        imagePullPolicy: Always  # Always pull in dev
        env:
        - name: NODE_ENV
          value: development
        - name: LOG_LEVEL
          value: debug
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-dashboard-frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: frontend
        imagePullPolicy: Always  # Always pull in dev
