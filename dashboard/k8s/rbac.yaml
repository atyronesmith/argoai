apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-dashboard
  namespace: argo-ai-demo
  labels:
    app: ai-workflow-dashboard

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-dashboard
  namespace: argo-ai-demo
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["argoproj.io"]
  resources: ["workflows", "workflowtemplates"]
  verbs: ["get", "list", "watch", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-dashboard
  namespace: argo-ai-demo
subjects:
- kind: ServiceAccount
  name: ai-dashboard
  namespace: argo-ai-demo
roleRef:
  kind: Role
  name: ai-dashboard
  apiGroup: rbac.authorization.k8s.io