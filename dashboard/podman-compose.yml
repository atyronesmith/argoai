# Podman Compose configuration for AI Workflow Dashboard
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
        VERSION: "${VERSION:-latest}"
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_PATH=/app/data/workflows.db
      - ARGO_SERVER=http://argo-server.argo-ai-demo.svc.cluster.local:2746
      - ARGO_NAMESPACE=argo-ai-demo
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend/data:/app/data:Z
      - ./backend/src:/opt/app-root/src/src:Z
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
        VERSION: "${VERSION:-latest}"
    ports:
      - "3000:8080"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - REACT_APP_WS_URL=ws://localhost:3001
    depends_on:
      - backend
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  dashboard-network:
    driver: bridge

volumes:
  backend-data:
    driver: local