apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-ai-demo

resources:
  - namespace.yaml
  - argo-workflows/
  - ollama/
  - minio/
  - workflows/

configMapGenerator:
  - name: workflow-controller-configmap
    namespace: argo-ai-demo
    literals:
      - |
        artifactRepository: |
          s3:
            bucket: argo-artifacts
            endpoint: minio.argo-ai-demo.svc.cluster.local:9000
            insecure: true
            accessKeySecret:
              name: minio-creds
              key: accesskey
            secretKeySecret:
              name: minio-creds
              key: secretkey

patchesStrategicMerge:
  - patches/argo-server-patch.yaml
  - patches/resource-limits.yaml

images:
  - name: ollama/ollama
    newTag: latest
  - name: argoproj/argocli
    newTag: v3.5.0
