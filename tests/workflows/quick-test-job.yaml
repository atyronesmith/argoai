apiVersion: batch/v1
kind: Job
metadata:
  name: ai-pipeline-quick-test
  namespace: argo-ai-demo
spec:
  template:
    spec:
      serviceAccountName: argo
      restartPolicy: Never
      containers:
      - name: test-runner
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Running AI Pipeline Quick Tests..."
          echo "===================================="

          # Test 1: Check Ollama is responding
          echo -n "Testing Ollama API... "
          if curl -s http://ollama:11434/api/tags > /dev/null; then
            echo "✓ PASS"
          else
            echo "✗ FAIL"
            exit 1
          fi

          # Test 2: Check MinIO is accessible
          echo -n "Testing MinIO API... "
          if curl -s http://minio:9000/minio/health/live > /dev/null; then
            echo "✓ PASS"
          else
            echo "✗ FAIL"
            exit 1
          fi

          # Test 3: Submit test workflow
          echo -n "Testing workflow submission... "
          cat > /tmp/test-workflow.yaml << 'EOF'
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
            generateName: test-basic-
          spec:
            entrypoint: test
            templates:
            - name: test
              script:
                image: alpine:latest
                command: [sh]
                source: |
                  echo "Test workflow executing"
                  echo "Document Type: Invoice"
                  echo "Priority: Normal"
          EOF

          # Here we would use kubectl/oc to submit
          echo "✓ PASS (mock)"

          echo ""
          echo "===================================="
          echo "Quick tests completed successfully!"
---
apiVersion: v1
